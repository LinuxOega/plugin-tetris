plugins {
    id 'base'
}

group 'run.halo.tetris.ui'

// This plugin ships no Console UI: ui/ is only the single source of truth for
// the Tetris rules (ui/src/core/tetris.js) plus its Node test suite. The
// standalone page is generated by scripts/build-standalone.mjs.
//
// Run the tests with the machine's Node directly instead of an npm task: the
// dependencies are already present in ui/node_modules, and this avoids npm's
// cache maintenance during every Gradle build.
tasks.register('rulesTest', Exec) {
    group = 'verification'
    description = 'Runs the Tetris rules and contract tests with Node.'
    workingDir layout.projectDirectory.asFile
    commandLine 'node', '--test'
}

tasks.named('check') {
    dependsOn tasks.named('rulesTest')
}
