<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="俄罗斯方块 — 可独立部署或嵌入文章、自定义页面的纯前端游戏页">
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <!-- Shown only when opened as a top-level Halo page (not inside an iframe). -->
    <a id="back-link" class="back-link" href="/" hidden>← 返回博客首页</a>

    <header class="header">
      <div class="heading">
        <h1>俄罗斯方块</h1>
        <p>堆叠方块、消除整行。方向键 / WASD 操作，空格硬降，C 暂存。</p>
      </div>
      <div class="scores">
        <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高分</span><strong id="best">0</strong></div>
        <div class="score-box"><span>消行</span><strong id="lines">0</strong></div>
        <div class="score-box"><span>等级</span><strong id="level">1</strong></div>
      </div>
    </header>

    <div class="toolbar">
      <input id="player" type="text" maxlength="24" placeholder="排行榜昵称（最多 24 字）" aria-label="排行榜昵称">
      <button id="new-game" type="button" class="btn primary">新游戏</button>
      <button id="pause" type="button" class="btn">暂停</button>
      <button id="submit" type="button" class="btn">提交成绩</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div class="layout">
      <section class="game">
        <div class="board-wrap">
          <div id="board" class="board" role="application" aria-label="俄罗斯方块棋盘"></div>
          <div id="overlay" class="overlay" hidden>
            <strong id="over-title">游戏结束</strong>
            <span id="over-detail"></span>
            <button id="retry" type="button" class="btn primary">再来一局</button>
          </div>
        </div>

        <div class="touch-controls" aria-label="触屏操作">
          <button type="button" data-action="left" aria-label="左移">←</button>
          <button type="button" data-action="rotate" aria-label="旋转">↻</button>
          <button type="button" data-action="right" aria-label="右移">→</button>
          <button type="button" data-action="down" aria-label="软降">↓</button>
          <button type="button" data-action="drop" aria-label="硬降">⤓</button>
          <button type="button" data-action="hold" aria-label="暂存">暂存</button>
        </div>
        <p class="hint">落块 <span id="pieces">0</span> · ← → 移动 · ↑ / X 旋转 · ↓ 软降 · 空格 硬降 · C 暂存 · P 暂停 · R 重开</p>
      </section>

      <aside class="side">
        <div class="preview-panel">
          <h2>下一个</h2>
          <div id="next-list" class="next-list"></div>
          <h2>暂存</h2>
          <div id="hold" class="preview"></div>
        </div>

        <div class="rank-panel">
          <div class="rank-head">
            <h2 id="rank-title">全站排行榜</h2>
            <button id="refresh" type="button" class="btn small">刷新</button>
          </div>
          <ol id="rank-list" class="rank-list"></ol>
          <p id="rank-empty" class="rank-empty">加载中…</p>
        </div>
      </aside>
    </div>

    <footer class="footer">俄罗斯方块 · 成绩仅保存在此浏览器</footer>
  </main>

  <!-- 访问约定：由 slug=tetris 的自定义页面提供 https://你的域名/tetris。
       本页不含任何域名配置：站点域名、协议、端口全部由浏览器当前地址自动决定，
       同一份文件装到任意域名都无需修改、无需重新打包。
       可选配置：在下方脚本之前设置 window.TETRIS_CONFIG
       { mode: 'local' } 强制本地榜；{ apiBase: 'https://...' } 指向自定义排行榜 API；
       { basePath: '/blog' } Halo 部署在子路径时指定前缀（默认自动从路径推导）；
       { homeUrl: '/' } 设置顶部「返回博客首页」链接；{ embedded: true } 强制隐藏该链接。
       { theme: 'off' } 关闭 Ethereal 主题跟随；{ theme: 'ethereal' } 强制启用；
       { defaultHue: 250 } 设置主题色相（默认 250）。未配置时自动识别同源 Ethereal 站点。
       默认仅在 Halo 插件路径下启用全站榜，其他任何位置都用浏览器本地榜。 -->
  <!-- tetris-core.js is generated from ui/src/core/tetris.js -->
  <script src="./tetris-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
